<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Date Plan?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient particle layer, shared across all screens -->
  <div id="particle-field" class="particle-field" aria-hidden="true"></div>

  <!-- Desktop-only cursor heart trail -->
  <div id="cursor-trail" class="cursor-trail" aria-hidden="true"></div>

  <main id="app" class="app">

    <!-- ============ SCREEN 1 : Opening / Invitation ============ -->
    <section id="screen-1" class="screen screen--opening is-active" data-screen="1">
      <div class="scene scene--sky">
        <div class="floaty-hearts" aria-hidden="true"></div>

        <div class="picnic picnic--opening">
          <div class="teddy teddy--male">
            <svg viewBox="0 0 120 120" class="teddy-svg"><use href="#teddy-male"></use></svg>
          </div>
          <div class="teddy teddy--female">
            <svg viewBox="0 0 120 120" class="teddy-svg"><use href="#teddy-female"></use></svg>
          </div>
        </div>

        <!-- Invitation card -->
        <div class="invite-card" id="invite-card">
          <h1 class="invite-title">Would you go on a date with me?</h1>
          <p class="invite-subtitle">Sab ke sath date pe jana hai&hellip; akele nahi!</p>

          <div class="button-row">
            <button class="btn btn--yes" id="btn-yes" type="button">YES</button>
            <button class="btn btn--no" id="btn-no" type="button">NO</button>
          </div>
        </div>

        <!-- Loader shown briefly after YES -->
        <div class="loader" id="loader">
          <div class="loader-teddies">🧸 💃 🧸</div>
          <p>Yayyy! Date loading&hellip;</p>
        </div>
      </div>
    </section>

    <!-- ============ SCREEN 2 : Invite others ============ -->
    <section id="screen-2" class="screen screen--invite" data-screen="2">
      <div class="scene scene--cafe">
        <h2 class="invite-heading">Whom would you like to invite with us?</h2>
        <p class="invite-heading-sub">Sabke sath date plan banate hain ✨</p>

        <!-- Cards render here from CONFIG.invitees — add more people in script.js -->
        <div class="people-grid" id="people-grid"></div>
      </div>
    </section>

    <!-- ============ SCREEN 3 : Plan cancelled ============ -->
    <section id="screen-3" class="screen screen--ending" data-screen="3">
      <div class="scene scene--void">
        <div class="broken-hearts" aria-hidden="true"></div>

        <div class="picnic picnic--sad">
          <div class="teddy teddy--male">
            <svg viewBox="0 0 120 120" class="teddy-svg"><use href="#teddy-male-sad"></use></svg>
          </div>
          <div class="teddy teddy--female">
            <svg viewBox="0 0 120 120" class="teddy-svg teddy-svg--small"><use href="#teddy-female-sad"></use></svg>
          </div>
          <div class="paper paper--cancelled">
            Date Plan?
            <span class="stamp">CANCELLED</span>
          </div>
        </div>

        <div class="ending-text">
          <p class="type-line" data-text="No one is available…"></p>
          <p class="type-line" data-text="Plan cancelled."></p>
          <p class="type-line" data-text="Looks like sabke sath date possible nahi hua 😔"></p>
          <p class="fade-line">Maybe next time&hellip; when the universe (and everyone's family) cooperates 🙄</p>

          <figure class="forgive-gif">
            <img src="https://media.tenor.com/tzvzrz4famQAAAAC/couple-forgive-me.gif" alt="Cartoon couple pleading and asking for forgiveness" loading="lazy" />
            <figcaption>Pic of you rn, begging the universe 🥲</figcaption>
          </figure>
        </div>

        <button class="btn btn--retry" id="btn-retry" type="button">Try again? ✨</button>
      </div>
    </section>

  </main>

  <!-- Inline SVG symbols: male (darker, rolling-eyes) and female (lighter, shy/blushy) teddies -->
  <svg width="0" height="0" style="position:absolute">

    <!-- MALE — darker fur, unimpressed "rolling eyes" look -->
    <symbol id="teddy-male" viewBox="0 0 120 120">
      <circle cx="30" cy="30" r="16" fill="#6B4630" stroke="#402A1B" stroke-width="2"></circle>
      <circle cx="90" cy="30" r="16" fill="#6B4630" stroke="#402A1B" stroke-width="2"></circle>
      <circle cx="30" cy="30" r="7" fill="#C9946B"></circle>
      <circle cx="90" cy="30" r="7" fill="#C9946B"></circle>
      <circle cx="60" cy="55" r="38" fill="#6B4630" stroke="#402A1B" stroke-width="2"></circle>
      <ellipse cx="60" cy="66" rx="16" ry="13" fill="#D9A874"></ellipse>
      <!-- unamused: flat half-lidded eyes, level brows, dead-flat mouth -->
      <path d="M39 43 L53 43" fill="none" stroke="#402A1B" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M67 43 L81 43" fill="none" stroke="#402A1B" stroke-width="2.4" stroke-linecap="round"></path>
      <ellipse cx="46" cy="49" rx="5" ry="5" fill="#FFF"></ellipse>
      <ellipse cx="74" cy="49" rx="5" ry="5" fill="#FFF"></ellipse>
      <path d="M40 46 Q46 42 52 46 L52 46 Q46 44.5 40 46 Z" fill="#6B4630"></path>
      <path d="M68 46 Q74 42 80 46 L80 46 Q74 44.5 68 46 Z" fill="#6B4630"></path>
      <circle cx="46" cy="50" r="2.4" fill="#2B2118"></circle>
      <circle cx="74" cy="50" r="2.4" fill="#2B2118"></circle>
      <ellipse cx="60" cy="62" rx="3.5" ry="3" fill="#3A2415"></ellipse>
      <path d="M51 72 L69 72" fill="none" stroke="#3A2415" stroke-width="2" stroke-linecap="round"></path>
      <ellipse cx="60" cy="102" rx="30" ry="16" fill="#6B4630" stroke="#402A1B" stroke-width="2"></ellipse>
      <path d="M43 94 Q60 106 77 94" fill="none" stroke="#33415C" stroke-width="7" stroke-linecap="round"></path>
    </symbol>

    <!-- MALE, sad — brows drooping, single tear -->
    <symbol id="teddy-male-sad" viewBox="0 0 120 120">
      <circle cx="30" cy="30" r="16" fill="#6B4630" stroke="#402A1B" stroke-width="2"></circle>
      <circle cx="90" cy="30" r="16" fill="#6B4630" stroke="#402A1B" stroke-width="2"></circle>
      <circle cx="30" cy="30" r="7" fill="#C9946B"></circle>
      <circle cx="90" cy="30" r="7" fill="#C9946B"></circle>
      <circle cx="60" cy="55" r="38" fill="#5A3A28" stroke="#402A1B" stroke-width="2"></circle>
      <ellipse cx="60" cy="66" rx="16" ry="13" fill="#C79865"></ellipse>
      <path d="M40 44 Q46 40 52 44" fill="none" stroke="#2B2118" stroke-width="2.2" stroke-linecap="round"></path>
      <path d="M68 44 Q74 40 80 44" fill="none" stroke="#2B2118" stroke-width="2.2" stroke-linecap="round"></path>
      <ellipse cx="46" cy="49" rx="3.6" ry="4.2" fill="#2B2118"></ellipse>
      <ellipse cx="74" cy="49" rx="3.6" ry="4.2" fill="#2B2118"></ellipse>
      <path d="M49 56 Q47 62 45 66" fill="none" stroke="#7FB8FF" stroke-width="3" stroke-linecap="round"></path>
      <ellipse cx="60" cy="62" rx="3.5" ry="3" fill="#3A2415"></ellipse>
      <path d="M50 74 Q60 68 70 74" fill="none" stroke="#3A2415" stroke-width="2" stroke-linecap="round"></path>
      <ellipse cx="60" cy="102" rx="30" ry="16" fill="#5A3A28" stroke="#402A1B" stroke-width="2"></ellipse>
      <path d="M43 94 Q60 106 77 94" fill="none" stroke="#2C374D" stroke-width="7" stroke-linecap="round"></path>
    </symbol>

    <!-- FEMALE — lighter fur, shy/blushy closed-eye smile -->
    <symbol id="teddy-female" viewBox="0 0 120 120">
      <circle cx="30" cy="30" r="16" fill="#F4C9A0" stroke="#E0A574" stroke-width="2"></circle>
      <circle cx="90" cy="30" r="16" fill="#F4C9A0" stroke="#E0A574" stroke-width="2"></circle>
      <circle cx="30" cy="30" r="7" fill="#FFE3C4"></circle>
      <circle cx="90" cy="30" r="7" fill="#FFE3C4"></circle>
      <circle cx="60" cy="55" r="38" fill="#F4C9A0" stroke="#E0A574" stroke-width="2"></circle>
      <ellipse cx="60" cy="66" rx="16" ry="13" fill="#FFE3C4"></ellipse>
      <!-- blush -->
      <ellipse cx="39" cy="58" rx="7" ry="4.5" fill="#FF9EC4" opacity=".55"></ellipse>
      <ellipse cx="81" cy="58" rx="7" ry="4.5" fill="#FF9EC4" opacity=".55"></ellipse>
      <!-- shy closed eyes (little upward curves + lashes) -->
      <path d="M40 47 Q46 42 52 47" fill="none" stroke="#4A2E1C" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M68 47 Q74 42 80 47" fill="none" stroke="#4A2E1C" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M52 45 L55 42" stroke="#4A2E1C" stroke-width="1.4" stroke-linecap="round"></path>
      <path d="M68 45 L65 42" stroke="#4A2E1C" stroke-width="1.4" stroke-linecap="round"></path>
      <ellipse cx="60" cy="62" rx="3" ry="2.4" fill="#C4527A"></ellipse>
      <path d="M55 70 Q60 74 65 70" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"></path>
      <ellipse cx="60" cy="102" rx="30" ry="16" fill="#F4C9A0" stroke="#E0A574" stroke-width="2"></ellipse>
      <!-- bow instead of scarf -->
      <circle cx="52" cy="92" r="6" fill="#FF6FA5"></circle>
      <circle cx="68" cy="92" r="6" fill="#FF6FA5"></circle>
      <circle cx="60" cy="93" r="4.5" fill="#E14E86"></circle>
    </symbol>

    <!-- FEMALE, sad — downturned lashes, single tear, faded blush -->
    <symbol id="teddy-female-sad" viewBox="0 0 120 120">
      <circle cx="30" cy="30" r="16" fill="#F4C9A0" stroke="#E0A574" stroke-width="2"></circle>
      <circle cx="90" cy="30" r="16" fill="#F4C9A0" stroke="#E0A574" stroke-width="2"></circle>
      <circle cx="30" cy="30" r="7" fill="#FFE3C4"></circle>
      <circle cx="90" cy="30" r="7" fill="#FFE3C4"></circle>
      <circle cx="60" cy="55" r="38" fill="#EABE93" stroke="#E0A574" stroke-width="2"></circle>
      <ellipse cx="60" cy="66" rx="16" ry="13" fill="#F5D5AC"></ellipse>
      <ellipse cx="39" cy="58" rx="7" ry="4.5" fill="#FF9EC4" opacity=".3"></ellipse>
      <ellipse cx="81" cy="58" rx="7" ry="4.5" fill="#FF9EC4" opacity=".3"></ellipse>
      <path d="M40 49 Q46 53 52 49" fill="none" stroke="#4A2E1C" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M68 49 Q74 53 80 49" fill="none" stroke="#4A2E1C" stroke-width="2.4" stroke-linecap="round"></path>
      <path d="M43 55 Q41 61 39 65" fill="none" stroke="#7FB8FF" stroke-width="2.6" stroke-linecap="round"></path>
      <ellipse cx="60" cy="62" rx="3" ry="2.4" fill="#C4527A"></ellipse>
      <path d="M55 74 Q60 70 65 74" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"></path>
      <ellipse cx="60" cy="102" rx="30" ry="16" fill="#EABE93" stroke="#E0A574" stroke-width="2"></ellipse>
      <circle cx="52" cy="92" r="6" fill="#E092B0"></circle>
      <circle cx="68" cy="92" r="6" fill="#E092B0"></circle>
      <circle cx="60" cy="93" r="4.5" fill="#C4527A"></circle>
    </symbol>

  </svg>

  <script src="script.js"></script>
</body>
</html>
